# Netlify 部署配置（YingoTab）
[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'static framework, no build step'"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/generate-config"
  to = "/.netlify/functions/generate-config"
  status = 200

# 防泄露：不存在这些文件
[[redirects]]
  from = "/config.json"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/assets"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/assets/"
  to = "/404.html"
  status = 404

# SPA 回退（最后）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
